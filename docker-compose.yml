services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: sagat
      POSTGRES_USER: sagat
      POSTGRES_PASSWORD: sagat
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sagat -d sagat"]
      interval: 5s
      timeout: 5s
      retries: 10
  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/sagat
      SPRING_DATASOURCE_USERNAME: sagat
      SPRING_DATASOURCE_PASSWORD: sagat
      NOTIFICATION_API_KEY: sagat
    ports:
      - "8080:8080"
volumes:
  postgres-data:
