spring.application.name=sagat
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/sagat}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sagat}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:sagat}
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.open-in-view=false
notification.api-key=${NOTIFICATION_API_KEY:sagat}
notification.dispatch.max-attempts=${NOTIFICATION_MAX_ATTEMPTS:3}
notification.worker.initial-delay-ms=${NOTIFICATION_WORKER_INITIAL_DELAY_MS:30000}
notification.worker.fixed-delay-ms=${NOTIFICATION_WORKER_DELAY_MS:30000}
